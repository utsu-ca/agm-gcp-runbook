<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Check-in</title>
    <link rel="stylesheet" href="/app.css">
</head>
<body>
    <div class="card">
        <h2>Student Check-in</h2>
        
        <div id="signin"></div>
        <p id="who" class="output"></p>
        <hr>

        <div class="form-group">
            <label for="cardInput">Swipe Card (mag stripe)</label>
            <input type="password" id="cardInput" autocomplete="off" placeholder="Click here, then swipe card">
        </div>

        <div class="form-group">
            <label><input type="checkbox" id="autoCheckIn"> Auto check-in after card swipe</label>
        </div>

        <div class="form-group">
            <label for="studentNum">Student Number</label>
            <input type="text" id="studentNum" inputmode="numeric">
        </div>

        <div class="form-group">
            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" autocomplete="off">
        </div>

        <div class="form-group">
            <label for="attendance">Location</label>
            <select id="attendance">
                <option value="in-person">In-Person</option>
                <option value="virtual">Virtual</option>
            </select>
        </div>

        <div class="btn-group">
            <button id="btnStatus" class="btn-status">Check Status</button>
            <button id="btnCheckIn" class="btn-checkin">Check In</button>
        </div>
        
        <div id="result" class="result" role="status" aria-live="polite">
            <div id="resultIcon" class="result-icon"></div>
            <div class="result-body">
                <div id="resultTitle" class="result-title"></div>
                <div id="resultDetail" class="result-detail"></div>
            </div>
        </div>

        <div id="matches" class="matches"></div>

        <div id="output" class="output"></div>
    </div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="/app.js"></script>
</body>
</html>
