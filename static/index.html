<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Student Check-in</title>
    <style>
        /* Base Reset & Variables */
        :root {
            --bg-body: #f3f4f6;
            --bg-card: #ffffff;
            --text-main: #1f2937;
            --text-label: #374151;
            --text-muted: #6b7280;
            --border-color: #d1d5db;
            --focus-ring: #3b82f6;
            --btn-gray: #4b5563;
            --btn-gray-hover: #374151;
            --btn-blue: #2563eb;
            --btn-blue-hover: #1d4ed8;
            --btn-green: #059669;
            --btn-green-hover: #047857;
            --font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: var(--font-family);
            background-color: var(--bg-body);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .card {
            background-color: var(--bg-card);
            border-radius: 0.75rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            width: 100%;
            max-width: 28rem;
        }

        h2 { font-size: 1.5rem; font-weight: 700; color: var(--text-main); margin-bottom: 0.5rem; text-align: center; }
        .subtitle { font-size: 0.875rem; color: var(--text-muted); text-align: center; margin-bottom: 1.5rem; }
        hr { border: 0; border-top: 1px solid #e5e7eb; margin: 1.5rem 0; }
        
        .auth-banner {
            background-color: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 0.375rem;
            padding: 0.75rem;
            font-size: 0.875rem;
            color: #1e40af;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .form-group { margin-bottom: 1rem; }
        label { display: block; font-size: 0.875rem; font-weight: 500; color: var(--text-label); margin-bottom: 0.25rem; }
        
        input[type="text"], input[type="password"] {
            width: 100%;
            border-radius: 0.375rem;
            border: 1px solid var(--border-color);
            padding: 0.5rem;
            font-family: inherit;
            font-size: 1rem;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus, input[type="password"]:focus {
            border-color: var(--focus-ring);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        .radio-group { display: flex; gap: 1rem; margin-top: 0.25rem; }
        .radio-label { display: inline-flex; align-items: center; font-size: 0.875rem; font-weight: 400; color: var(--text-label); cursor: pointer;}
        .radio-label input { margin-right: 0.5rem; accent-color: var(--btn-blue); cursor: pointer;}

        .btn-group { display: flex; gap: 0.75rem; margin-top: 1.5rem; }
        button {
            flex: 1;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            border: none;
            font-size: 1rem;
            font-weight: 500;
            color: #fff;
            cursor: pointer;
            transition: background-color 0.2s;
            font-family: inherit;
        }
        
        .btn-status { background-color: var(--btn-gray); }
        .btn-status:hover { background-color: var(--btn-gray-hover); }
        .btn-checkin { background-color: var(--btn-blue); }
        .btn-checkin:hover { background-color: var(--btn-blue-hover); }
        .btn-export { background-color: var(--btn-green); margin-top: 0.75rem; width: 100%; }
        .btn-export:hover { background-color: var(--btn-green-hover); }

        .token-details {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
        }

        .output {
            margin-top: 1rem;
            padding: 0.75rem;
            background-color: #f9fafb;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            color: var(--text-label);
            word-break: break-all;
            white-space: pre-wrap;
            display: none;
        }
        .output.visible { display: block; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Student Check-in</h2>
        <div class="subtitle">Google Workspace Authenticated</div>

        <div id="authBanner" class="auth-banner">
            <span id="authStatusText">Checking authentication...</span>
        </div>

        <div class="form-group" id="tokenGroup" style="display: none;">
            <label for="authToken">Google Workspace ID Token / ******
            <input type="password" id="authToken" placeholder="Enter ****** if not using Cloud IAP">
            <div class="token-details">Automatically handled under Cloud IAP; provide token for direct API access.</div>
        </div>

        <div class="form-group">
            <label for="studentNum">Student Number</label>
            <input type="text" id="studentNum" placeholder="e.g. 1001234567">
        </div>
        
        <div class="form-group">
            <label>Attendance Mode</label>
            <div class="radio-group">
                <label class="radio-label">
                    <input type="radio" name="attendance" value="in-person" checked> In-Person
                </label>
                <label class="radio-label">
                    <input type="radio" name="attendance" value="virtual"> Virtual
                </label>
            </div>
        </div>
        
        <div class="form-group">
            <label for="location">Location (if in-person)</label>
            <input type="text" id="location" placeholder="e.g. Room 101">
        </div>
        
        <div class="btn-group">
            <button onclick="handleStatus()" class="btn-status">Check Status</button>
            <button onclick="handleCheckIn()" class="btn-checkin">Check In</button>
        </div>

        <div id="adminSection" style="display: none;">
            <button onclick="handleExport()" class="btn-export">Trigger Sheets Export</button>
        </div>
        
        <div id="output" class="output"></div>
    </div>

    <script>
        // Security Hardening: URL-fragment credentials (#user=...&psk=...) are strictly deprecated.
        // If any hash exists, clear it immediately to avoid leaking credentials via browser history or shoulder surfing.
        if (window.location.hash) {
            history.replaceState(null, null, window.location.pathname);
        }

        // Generate a cryptographically random nonce
        function generateNonce(length = 16) {
            const array = new Uint8Array(length);
            window.crypto.getRandomValues(array);
            return Array.from(array, byte => byte.toString(16).padStart(2, '0')).join('');
        }

        function getAuthHeaders() {
            const headers = { 'Content-Type': 'application/json' };
            const tokenInput = document.getElementById('authToken');
            const token = tokenInput ? tokenInput.value.trim() : '';
            if (token) {
                headers['Authorization'] = `******;
            }
            return headers;
        }

        async function checkAuthStatus() {
            const authText = document.getElementById('authStatusText');
            const tokenGroup = document.getElementById('tokenGroup');
            const adminSection = document.getElementById('adminSection');

            try {
                const response = await fetch('/api/auth/me', {
                    headers: getAuthHeaders(),
                    credentials: 'same-origin'
                });

                if (response.ok) {
                    const data = await response.json();
                    authText.innerText = `Signed in: ${data.email} (${data.role})`;
                    if (data.role === 'admin') {
                        adminSection.style.display = 'block';
                    } else {
                        adminSection.style.display = 'none';
                    }
                } else {
                    authText.innerText = 'Not signed in. Enter bearer token or sign in via Google Workspace.';
                    tokenGroup.style.display = 'block';
                }
            } catch (err) {
                authText.innerText = 'Authentication check offline. Provide bearer token if required.';
                tokenGroup.style.display = 'block';
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            checkAuthStatus();
            const tokenInput = document.getElementById('authToken');
            if (tokenInput) {
                tokenInput.addEventListener('change', checkAuthStatus);
            }
        });

        // API Calls
        async function sendRequest(endpoint, payloadObj) {
            const outputEl = document.getElementById('output');
            
            // Add timestamp and cryptographic nonce for anti-replay protection
            payloadObj.timestamp = Date.now();
            payloadObj.nonce = generateNonce(16);

            try {
                const response = await fetch(`/api/${endpoint}`, {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    credentials: 'same-origin',
                    body: JSON.stringify(payloadObj)
                });
                
                const result = await response.json();
                outputEl.classList.add('visible');
                outputEl.innerText = JSON.stringify(result, null, 2);
            } catch (err) {
                outputEl.classList.add('visible');
                outputEl.innerText = `Error: ${err.message}`;
            }
        }

        function handleStatus() {
            const studentNum = document.getElementById('studentNum').value.trim();
            if (!studentNum) {
                alert('Please enter a student number');
                return;
            }
            sendRequest('is_checked_in', { student_number: studentNum });
        }

        function handleCheckIn() {
            const studentNum = document.getElementById('studentNum').value.trim();
            if (!studentNum) {
                alert('Please enter a student number');
                return;
            }
            const attendance = document.querySelector('input[name="attendance"]:checked').value;
            sendRequest('check_in', {
                student_number: studentNum,
                location: document.getElementById('location').value.trim(),
                attendance_mode: attendance
            });
        }

        function handleExport() {
            sendRequest('trigger_export', {});
        }
    </script>
</body>
</html>
