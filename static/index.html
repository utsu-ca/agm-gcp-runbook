<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Check-in</title>
    <link rel="stylesheet" href="/app.css">
</head>
<body>
    <div class="card">
        <h2>Student Check-in</h2>
        
        <div id="signin"></div>
        <p id="who" class="output"></p>
        <hr>
        
        <div class="form-group">
            <label for="studentNum">Student Number</label>
            <input type="text" id="studentNum">
        </div>
        
        <div class="form-group">
            <label>Attendance Mode</label>
            <div class="radio-group">
                <label class="radio-label">
                    <input type="radio" name="attendance" value="in-person" checked> In-Person
                </label>
                <label class="radio-label">
                    <input type="radio" name="attendance" value="virtual"> Virtual
                </label>
            </div>
        </div>
        
        <div class="form-group">
            <label for="location">Location (if in-person)</label>
            <input type="text" id="location" placeholder="e.g. Room 101">
        </div>
        
        <div class="btn-group">
            <button id="btnStatus" class="btn-status">Check Status</button>
            <button id="btnCheckIn" class="btn-checkin">Check In</button>
        </div>
        
        <div id="output" class="output"></div>
    </div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="/app.js"></script>
</body>
</html>
